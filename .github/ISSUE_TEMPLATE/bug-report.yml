name: Bug report
description: Report a reproducible defect without secrets.
title: "bug: "
body:
  - type: textarea
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction steps and redacted logs
    validations:
      required: true
  - type: input
    attributes:
      label: Version and commit
    validations:
      required: true
