name: Server test finding
description: Record a redacted finding from target-system testing.
title: "finding: "
body:
  - type: input
    attributes: {label: Script version}
    validations: {required: true}
  - type: input
    attributes: {label: Commit-SHA}
    validations: {required: true}
  - type: input
    attributes: {label: SHA-256}
    validations: {required: true}
  - type: input
    attributes: {label: Distribution, version, kernel, and virtualization}
    validations: {required: true}
  - type: textarea
    attributes: {label: Exact command, affected phase, and Lynis score before/after}
    validations: {required: true}
  - type: textarea
    attributes: {label: Lynis test ID, expected and actual behavior}
    validations: {required: true}
  - type: textarea
    attributes: {label: Relevant redacted logs and reproduction steps}
    validations: {required: true}
  - type: textarea
    attributes: {label: Security impact, rollback status, and acceptance criteria}
    validations: {required: true}
